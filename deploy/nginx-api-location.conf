# Include this *before* any generic / location in the antiQ server block.
# Chat attachments use resumable encrypted chunks. Keep this limit above the
# configured maximum chunk size plus request overhead (default: 8 MiB).
location /api/ {
    client_max_body_size 8m;
    client_body_timeout 600s;
    proxy_request_buffering off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8020;
}
