<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="antiQ secure corporate messenger">
  <meta name="theme-color" content="#07090D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="antiQ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>antiQ</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #07090d; }
    #antiq-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      color: #f6f9fc; font: 600 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -2px;
      transition: opacity 260ms ease;
    }
    #antiq-splash img { width: 88px; height: 88px; margin-right: 18px; vertical-align: middle; }
    #antiq-splash.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="antiq-splash">
    <div><img src="icons/Icon-192.png" alt="">antiQ</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('antiq-splash');
      splash.classList.add('hidden');
      setTimeout(() => splash.remove(), 300);
    });
  </script>
</body>
</html>
