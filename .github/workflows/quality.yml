name: quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security audit tools
        run: |
          python -m pip install -r services/backend/requirements.txt
          python -m pip install -r services/backend/requirements-security.txt
      - name: Scan complete Git history for credentials
        run: python tools/security_audit.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r services/backend/requirements.txt --strict
      - name: Audit Dart and Flutter dependencies
        run: python tools/audit_pub_dependencies.py
      - name: Verify fail-closed production settings
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: security-gate-only-abcdefghijklmnopqrstuvwxyz-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
          DJANGO_ALLOWED_HOSTS: chat.example.invalid
          DATABASE_URL: postgresql://audit:audit@127.0.0.1:5432/audit
          AWS_REGION: us-east-1
          AWS_KMS_ESCROW_KEY_ID: arn:aws:kms:us-east-1:000000000000:key/security-gate
        run: python services/backend/manage.py check --deploy

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pqc_chat_test
          POSTGRES_USER: pqc_chat
          POSTGRES_PASSWORD: pqc_chat
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U pqc_chat -d pqc_chat_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r services/backend/requirements.txt
      - name: Backend tests (PostgreSQL)
        env:
          DB_BACKEND: postgres
          POSTGRES_DB: pqc_chat_test
          POSTGRES_USER: pqc_chat
          POSTGRES_PASSWORD: pqc_chat
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          SQLITE_PATH: ""
        run: python services/backend/manage.py test users chat --verbosity 1

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
